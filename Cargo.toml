[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/akira-shirase-oss/personal-voice-agent"
publish = false

[workspace.dependencies]
voice-domain = { path = "crates/voice-domain" }
voice-session = { path = "crates/voice-session" }

# External crates: versions live here only. Minimal features; one async runtime (Tokio).
# No network crate anywhere: nothing in this workspace talks to a network (D-014).
crc32fast = "1.5.4"
libc = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync", "time"] }
uuid = { version = "1.29", features = ["v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "warn"
expect_used = "warn"
allow_attributes_without_reason = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

[profile.release]
debug = "line-tables-only"
