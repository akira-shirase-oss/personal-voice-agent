name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (toolchain, fmt, clippy, test, architecture)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Third-party actions are pinned to commit SHAs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --component clippy,rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: scripts/check-toolchain.sh
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: cargo test (in a private temp dir; tests may leave no data directory behind)
        run: |
          export TMPDIR="$(mktemp -d)"
          cargo test --workspace --locked
          left="$(find "$TMPDIR" -mindepth 1 -maxdepth 1 -name 'pva-*')"
          if [ -n "$left" ]; then echo "tests left data directories behind: $left"; exit 1; fi
      - run: scripts/check-architecture.sh
      - name: attack protections proven (each attack test fails without its guard)
        run: scripts/prove-attacks.sh

  fuzz:
    name: fuzz smoke (nightly; 60 s per target, seeded corpus)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install nightly for cargo-fuzz
        run: rustup toolchain install nightly --profile minimal
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: 60 s smoke per target (any crash is a red-first bug)
        working-directory: tests/attacks/fuzz
        run: |
          for target in frame_line record_decode guard_classify; do
            cargo +nightly fuzz run "$target" --fuzz-dir . -- -max_total_time=60 -timeout=25
          done

  swift:
    name: swift (apps/macos build and tests, macOS SDK 26+ only)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal
      - name: Build the session service the app launches
        run: cargo build --locked -p voice-session
      - run: scripts/ci-swift.sh
